services:
  redis:
    container_name: spy-bot-redis
    volumes:
      - redis_data:/data
    networks:
      - spy-bot-network
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-mypassword}
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mypassword}

  mongo:
    image: mongo:7
    container_name: spy-bot-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-spybot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-spybot}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - spy-bot-network

  app:
    build: .
    container_name: spy-bot-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - redis
      - mongo
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    networks:
      - spy-bot-network

volumes:
  redis_data:
  mongo_data:

networks:
  spy-bot-network:
    driver: bridge
